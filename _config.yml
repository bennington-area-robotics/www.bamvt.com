title: Bennington Area Makers
description: Community making in Bennington, Vermont. Home of Bennington Area Robotics.
url: https://www.bamvt.com

# Build settings
markdown: kramdown

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

exclude:
  - README.md
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - resources
  - bin

collections:
  events:
    output: true

# Preserve downloadable documents without submitting files lacking canonical metadata.
defaults:
  - scope:
      path: "**/*.pdf"
    values:
      sitemap: false
